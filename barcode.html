<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Absensi | OYITOK GROUP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      :root { --ink:#162b3d; --teal:#163a63; --gold:#c7952d; --cream:#eef2f7; --line:#c8d3df; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; padding:32px 18px; color:var(--ink); background:var(--cream); font-family:"DM Sans",sans-serif; }
      main { max-width:850px; margin:auto; }
      header { display:flex; align-items:end; justify-content:space-between; gap:20px; margin-bottom:28px; border-bottom:1px solid var(--line); padding-bottom:20px; }
      h1 { margin:0; font:700 clamp(25px,5vw,40px) "Space Grotesk",sans-serif; letter-spacing:-1px; }
      p { color:#71878a; font-size:13px; }
      .qr-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
      .qr-card { display:flex; flex-direction:column; align-items:center; gap:13px; padding:22px 14px 25px; background:#fff; border:1px solid var(--line); border-radius:14px; text-align:center; }
      .qr-card h2 { margin:0; font:700 18px "Space Grotesk",sans-serif; }
      .qr-code { width:190px; height:190px; padding:10px; background:#fff; border:1px solid #eef3f0; }
      .qr-code img { display:block; width:100%; height:100%; image-rendering:pixelated; }
      .code-label { margin:0; color:var(--teal); font-size:11px; font-weight:700; letter-spacing:.5px; }
      .print-button { margin-top:24px; padding:12px 18px; border:0; border-radius:8px; background:var(--gold); color:#fff; font:700 12px "DM Sans",sans-serif; cursor:pointer; }
      @media (max-width:650px) { body { padding-top:22px; } header { display:block; } .qr-grid { grid-template-columns:1fr; } .qr-code { width:min(68vw,220px); height:min(68vw,220px); } .print-button { width:100%; } }
      @media print { body { background:#fff; padding:0; } header p,.print-button { display:none; } header { margin-bottom:18px; } .qr-grid { gap:10px; } .qr-card { break-inside:avoid; box-shadow:none; } }
    </style>
  </head>
  <body>
    <main>
      <header><div><h1>QR Code Absensi</h1><p>ABSENSI OYITOK GROUP · Gunakan kamera untuk scan.</p></div><button class="print-button" onclick="window.print()">Cetak QR Code</button></header>
      <section class="qr-grid" aria-label="QR code absensi">
        <article class="qr-card"><h2>MARIA</h2><div class="qr-code" id="qrMaria"></div><p class="code-label">OYITOK-MARIA-001</p></article>
        <article class="qr-card"><h2>SHERLY</h2><div class="qr-code" id="qrSherly"></div><p class="code-label">OYITOK-SHERLY-001</p></article>
        <article class="qr-card"><h2>SAVINA</h2><div class="qr-code" id="qrSavina"></div><p class="code-label">OYITOK-SAVINA-001</p></article>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
      const codes = { qrMaria: "OYITOK-MARIA-001", qrSherly: "OYITOK-SHERLY-001", qrSavina: "OYITOK-SAVINA-001" };
      Object.entries(codes).forEach(([elementId, value]) => new QRCode(document.getElementById(elementId), { text: value, width: 170, height: 170, colorDark: "#15323a", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H }));
    </script>
  </body>
</html>
